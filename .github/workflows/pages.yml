name: Deploy delivery site to GitHub Pages

# GitHub Pages serves the site from the gh-pages branch (the built static
# output of web/out/). This workflow rebuilds it and force-pushes that branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - name: Build both extensions (produces download zips)
        run: bun run build
      - run: bun install --cwd web --frozen-lockfile
      - name: Static export of the site (bakes in the zips)
        run: bun run web:build
        env:
          NEXT_PUBLIC_BASE_PATH: /newspaper-archive-scraper
      - name: Deploy web/out to the gh-pages branch
        run: |
          cd web/out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub Pages (Jekyll) won't serve _next/* without this file.
          touch .nojekyll
          git add -A
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
